<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Library</title>
    <link rel="icon" href="/images/5921.jpg" type="image/jpg">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer ></script>
</head>
<body>
    <header>
        <h1><img src="images/5921.jpg" alt="book icon">Simple Library</h1>
        <ul>
            
            <l1><img src="images/magnify.svg" alt="magnify glass icon">
                <input type="text" placeholder="Search"></l1>
            <l1>
                <ul>
                    <li><button id="add-new">Add book</button></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="https://www.amazon.com/amz-books/store?ccs_id=9d8dca00-d3f7-4059-bfe8-6caa49b2adc9">Buy</a></li>
                </ul>
            </l1>
        </ul>
    </header>
     <dialog>
            <form id="myForm" >
                <fieldset>
                    <legend>Book form</legend>   
                    <div>
                        <label for="book_title">Book Title:</label>
                        <input type="text" name="book_title" id="book_title" placeholder="The Guardian">
                    </div>

                    <div>
                        <label for="author">Author:</label>
                        <input type="text" name="author" id="author" placeholder="New times Newpaper">
                    </div>

                    <div>
                        <label for="pages">Pages:</label>
                        <input type="number" name="pages" id="pages" placeholder="0">
                    </div>
                    <button id="submit" type="submit" method="dialog">Submit</button>
                </fieldset>
            </form>
        </dialog>
    <main>
       
<div id="banner"></div>
        <div id="history">
            <h2>Read</h2>
            <div id="current-box">
                <div class="arrow left"><img src="images/icons8-double-left-96.png" alt="arrow-left icon"></div>
                <div id="current-gallary"></div>
                <div class="arrow right"><img src="images/icons8-double-right-96.png" alt="arrow-rignt icon"></div>
            </div>
        </div>
        <div id="library">
            <h2>Library</h2>
            <div id="library-box">
                <div class="arrow left"><img src="images/icons8-double-left-96.png" alt="arrow-left icon"></div>
                <div id="library-gallary"></div>
                <div class="arrow right"><img src="images/icons8-double-right-96.png" alt="arrow-rignt icon"></div>
           
            </div>
        </div>
        <div id="new-to-library">
            <h2>New</h2>
        <div id="new-box">
            <div class="arrow left"><img src="images/icons8-double-left-96.png" alt="arrow-left icon"></div>
             <div id="new-gallary"></div>
            <div class="arrow right"><img src="images/icons8-double-right-96.png" alt="arrow-rignt icon"></div>
           
        </div>
        </div>
    </main>
    <footer>Made by PinkPineapple</footer>
</body>
</html>
