<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Library</title>
</head>
<body>
    <header>
        <h1>Simple Library</h1>
        <ul>
            
            <l1><input type="text" placeholder="Wuthering Heights"></l1>
            <l1>
                <ul>
                    <li><button>Add new book</button></li>
                    <li>About</li>
                    <li>Buy</li>
                </ul>
            </l1>
        </ul>
    </header>
    <main>
        <dialog>
            <form action="https://httpbin.org/post" action="post">
                <fieldset>
                    <legend>Book form</legend>   
                    <div>
                        <label for="book_title">Book Title:</label>
                        <input type="text" name="book_title" id="book_title" placeholder="The Guardian">
                    </div>

                    <div>
                        <label for="author">Author:</label>
                        <input type="text" name="author" id="author" placeholder="New times Newpaper">
                    </div>

                    <div>
                        <label for="pages">Pages:</label>
                        <input type="number" name="pages" id="pages" placeholder="0">
                    </div>
                    <button type="submit">Submit</button>
                </fieldset>
            </form>
        </dialog>

        <div id="history">
            <h2>History</h2>
            <div id="historyp-gallary"></div>
        </div>
        <div id="library">
            <h2>Library</h2>
            <div id="library-gallary"></div>
        </div>
        <div id="new-to-library"><h2>New Releases</h2>
        <div id="new-to-lib-gallary"></div>
        </div>
    </main>
    <footer>Made by PinkPineapple</footer>
</body>
</html>
